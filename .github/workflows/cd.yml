on:
  push:
    branches: [main]

jobs:
  deploy:
    Name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Run unit testing
        run: ./scripts/buildprod.sh
